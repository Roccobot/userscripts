<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roccobot userscripts</title>
<meta name="description" content="Roccobot's userscripts for Violentmonkey and Tampermonkey, one tap from install.">
<link rel="icon" href="Roccobot.png">
<!--
  The install page of Roccobot's userscripts. The list of scripts lives in SCRIPTS below and
  nowhere else; each version is read at runtime from the script's own @version, so the page
  never shows a stale number. Every text reaches the page through textContent.
  Author: Rocco Casadei, a.k.a. Roccobot
-->
<style>
  :root {
    color-scheme: light dark;
    --fg: #16232b; --bg: #f4f6f7; --card: #fff; --line: #dfe4e7; --sub: #5d6d76; --acc: #1f5562; --on-acc: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #e9eef0; --bg: #141b1f; --card: #1c262b; --line: #2c383e; --sub: #9aa9b1; --acc: #7fd0e0; --on-acc: #0f1a1e; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  main { max-width: 46rem; margin: 0 auto; padding: 2rem 1rem 3rem; }
  header { display: flex; align-items: center; gap: .9rem; margin-bottom: .6rem; }
  header img { width: 3rem; height: 3rem; border-radius: 12px; }
  h1 { font-size: 1.5rem; margin: 0; }
  p { text-wrap: pretty; }
  .intro { color: var(--sub); margin: 0 0 1.6rem; }
  .list { display: grid; gap: .9rem; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 1rem 1.1rem; display: grid; grid-template-columns: 1fr auto; gap: .2rem 1rem; align-items: center;
  }
  .name { font-weight: 700; font-size: 1.05rem; margin: 0; }
  .ver { color: var(--sub); font-weight: 400; font-size: .85rem; margin-left: .4rem; white-space: nowrap; }
  .site { grid-column: 1; color: var(--acc); font-size: .85rem; margin: 0; }
  .blurb { grid-column: 1 / -1; margin: .35rem 0 0; }
  .more { grid-column: 1 / -1; font-size: .85rem; margin: .2rem 0 0; }
  .more a { color: var(--sub); }
  .install {
    grid-column: 2; grid-row: 1 / span 2; text-decoration: none; font-weight: 700;
    background: var(--acc); color: var(--on-acc); border-radius: 999px; padding: .65rem 1.1rem;
    min-height: 44px; display: inline-flex; align-items: center; white-space: nowrap;
  }
  .install:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
  footer { color: var(--sub); font-size: .85rem; margin-top: 2rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  footer p { margin: 0; }
  footer a { color: var(--sub); }
  /* A display rule would beat the UA's [hidden], so the attribute is made to win */
  [hidden] { display: none !important; }
  .list + .list { margin-top: .9rem; }
  /* The mark at the end of the footer: the glyph is small, the touch area is 44 px, and the negative
     margins keep that area from making the footer taller or pushing the mark off the right edge */
  .mark {
    flex: none; width: 2.75rem; height: 2.75rem; margin: -.9rem -.8rem -.9rem 0; padding: 0;
    display: grid; place-items: center; background: none; border: 0; color: var(--sub); cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .mark svg { width: 1.1rem; height: auto; }
  .mark[aria-expanded="true"] { color: var(--acc); }
  .mark:focus-visible { outline: 2px solid var(--acc); outline-offset: -4px; border-radius: 10px; }
</style>
</head>
<body>
<main>
  <header>
    <img src="Roccobot.png" alt="">
    <h1>Roccobot userscripts</h1>
  </header>
  <p class="intro">Install Violentmonkey or Tampermonkey first, then tap Install: the manager opens its own install page, and updates arrive by themselves.</p>
  <div class="list" id="list"></div>
  <div class="list" id="more" hidden></div>
  <footer>
    <p>Source code and full notes on <a href="https://github.com/Roccobot/userscripts">GitHub</a>.</p>
    <button class="mark" id="mark" type="button" aria-label="Roccobot" aria-controls="more" aria-expanded="false"><svg viewBox="10 8 160 145" aria-hidden="true"><path d="M103.08,73.5h57.41l-4.92-61.87H24.67v15.55h57.09c-.82,11.19-1.97,21.3-3.61,30.62H20.24l4.43,15.7h49.7c-2.46,8.39-5.41,15.55-9.02,21.3-10.01,15.86-26.9,29.69-50.85,41.35l10.99,13.37c26.25-13.68,44.95-29.69,55.94-48.19,3.28-5.6,6.07-12.28,8.69-20.05,12.14,29.23,33.79,51.92,65.12,68.24l10.83-13.37c-30.51-14.77-51.51-35.6-62.99-62.65ZM99.14,27.18h42.71l1.34,30.62h-47.67c1.48-9.02,2.62-19.28,3.61-30.62Z" fill="currentColor" fill-rule="evenodd"/></svg></button>
  </footer>
</main>
<script>
  'use strict';
  // The one list of scripts: file name, title as in @name, where it works, what it does,
  // and its section of the README. A script marked `hidden` is not on the page until the mark
  // in the footer is tapped, and goes away again with a second tap.
  const SCRIPTS = [
    { file: 'DIVRoccobot.user.js', name: 'Decent Image Viewer', site: 'Any image opened in the browser',
      blurb: 'A better viewer for images: fit or real size, zoom with wheel, pinch or keys, pan, a navigator and its own right-click menu. Works on local files and SVG too.',
      readme: 'decent-image-viewer' },
    { file: 'QwantRoccobot.user.js', name: 'Qwant Roccobot', site: 'qwant.com',
      blurb: 'A cleaner Qwant without ads, promos or clutter. Image results open the original file, and on a phone they become a carousel you swipe.',
      readme: 'qwant-roccobot' },
    { file: 'PHRoccobot.user.js', name: 'PH Roccobot', site: 'pornhub.com', hidden: true,
      blurb: 'Keeps the site in English, skips the ad before the video and adds a button that downloads it at the best quality.',
      readme: 'ph-roccobot' },
    { file: 'ENFRoccobot.user.js', name: 'ENF Roccobot', site: 'enf-cmnf.cc, enfhub.com, xhamster.com', hidden: true,
      blurb: 'Download buttons for the videos, and every full-size photo of a post in one ZIP.',
      readme: 'enf-roccobot' },
    { file: 'NSFWARoccobot.user.js', name: 'NSFWA Roccobot', site: 'nsfwalbum.com', hidden: true,
      blurb: 'Real images you can open and save again, and a whole album at full resolution in one ZIP.',
      readme: 'nsfwa-roccobot' },
    { file: 'FapopediaRoccobot.user.js', name: 'Fapopedia Roccobot', site: 'fapopedia.net', hidden: true,
      blurb: 'Every image of a gallery at full resolution, in one ZIP.',
      readme: 'fapopedia-roccobot' },
    { file: 'LotRWikiRoccobot.user.js', name: 'LotRWiki Roccobot', site: 'lotr.fandom.com',
      blurb: 'A lighter Tolkien wiki: no giant background, ads, side rail or oversized footer. The articles stay as they are.',
      readme: 'lotrwiki-roccobot' }
  ];

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text) n.textContent = text;
    return n;
  }

  // No paragraph line may end on a short word, nor leave a short word alone at the end:
  // short words are tied to the next one, and the last word to the one before, with a
  // no-break space (U+00A0).
  // The lookbehind does not consume the space before a word, so back-to-back short words
  // ('of a post') are all tied in one pass.
  const CORTE = /(?<=^|\s)(a|an|the|of|to|in|on|or|and|by|its|at|for|it|is|no|you)\s+/gi;
  function lega(t) {
    return t.replace(CORTE, '$1 ').replace(/\s+(\S+)$/, ' $1');
  }
  const intro = document.querySelector('.intro');
  intro.textContent = lega(intro.textContent);

  // One card per script, added to the given list
  function addCard(list, s) {
    const card = el('article', 'card');
    const name = el('h2', 'name', s.name);
    const ver = el('span', 'ver');
    name.appendChild(ver);
    const install = el('a', 'install', 'Install');
    install.href = s.file;
    install.setAttribute('aria-label', 'Install ' + s.name);
    const more = el('p', 'more');
    const link = el('a', '', 'Details');
    link.href = 'https://github.com/Roccobot/userscripts#' + s.readme;
    more.appendChild(link);
    card.append(name, install, el('p', 'site', s.site), el('p', 'blurb', lega(s.blurb)), more);
    list.appendChild(card);
    // the version comes from the script itself: one source, never stale
    fetch(s.file, { cache: 'no-cache' })
      .then(function (r) { return r.ok ? r.text() : ''; })
      .then(function (t) {
        const m = /@version\s+(\S+)/.exec(t);
        if (m) ver.textContent = 'v' + m[1];
      })
      .catch(function () { /* the card works without the number */ });
  }

  for (const s of SCRIPTS) if (!s.hidden) addCard(document.getElementById('list'), s);

  // The mark in the footer is an on-off key for the hidden scripts. Nothing is stored: a reload
  // brings the page back as everyone sees it. The cards are built the first time they are shown,
  // so their files are not even requested before.
  const mark = document.getElementById('mark');
  const more = document.getElementById('more');
  mark.addEventListener('click', function () {
    const on = more.hidden;
    if (on && !more.firstChild) for (const s of SCRIPTS) if (s.hidden) addCard(more, s);
    more.hidden = !on;
    mark.setAttribute('aria-expanded', String(on));
    // the new cards appear above the footer: bring them into view
    if (on) more.scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  });
</script>
</body>
</html>
